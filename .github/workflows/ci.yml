name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Apply verified TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/_server/routes/inventory.ts')
          text = path.read_text()
          updated = text.replace('previousStock,\n          newStock,', 'previousStock: prevStock,\n          newStock,')
          updated = updated.replace('details: { previousStock, newStock, diff, reason }', 'details: { previousStock: prevStock, newStock, diff, reason }')
          updated = updated.replace("permanent === 'true' || permanent === true", "permanent === 'true'")
          if updated == text:
              raise SystemExit('Expected inventory fixes were not found; refusing to continue.')
          path.write_text(updated)
          PY

      - name: TypeScript / lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified source fix
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/_server/routes/inventory.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: resolve inventory TypeScript errors"
            git push
          fi
